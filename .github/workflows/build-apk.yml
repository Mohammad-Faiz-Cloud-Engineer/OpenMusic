name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Resolve env vars with proper defaults before any build step.
      # secrets || fallback does NOT work in GitHub Actions — secrets evaluate
      # to empty string when unset, so we use a dedicated step instead.
      - name: Resolve env vars
        run: |
          API_URL="${{ secrets.EXPO_PUBLIC_API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://LocalFind-OpenMusic-API.hf.space"
          fi
          echo "EXPO_PUBLIC_API_BASE_URL=$API_URL" >> $GITHUB_ENV
          echo "EXPO_PUBLIC_SENTRY_DSN=${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}" >> $GITHUB_ENV

      # IMPORTANT: EXPO_PUBLIC_* vars must be present HERE — Metro inlines them
      # into the JS bundle during prebuild. Setting them only on the Gradle step
      # is too late; the bundle is already baked by then.
      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        if: ${{ inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmusic-${{ inputs.build_type }}-apk
          path: android/app/build/outputs/apk/${{ inputs.build_type }}/app-${{ inputs.build_type }}.apk
          retention-days: 30
